# The docs of the bootable images, to preview alone (mkdocs serve) and to check strictly in
# pull requests. On unseenet.org they are gathered by unseenet/unseenet-docs
# (sources.yml), at the same addresses; links to pages elsewhere are full
# unseenet.org addresses.
site_name: Unseenet - the bootable images
site_url: https://unseenet.org/
repo_url: https://github.com/unseenet/unseenet-bootable
theme:
  name: material
  font: false
nav:
  - Bootable (USB, SSD etc.): bootable.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
