UI menu.c32
PROMPT 0
TIMEOUT 30
MENU TITLE Unseenet @VERSION@
MENU COLOR title 1;36;40 #ff34d399 #00000000 std
MENU COLOR sel 7;37;40 #ff10302a #ff34d399 all
DEFAULT unseenet

LABEL unseenet
  MENU LABEL Unseenet
  LINUX /boot/vmlinuz-lts
  INITRD /boot/initramfs-lts
  APPEND @CMDLINE@

LABEL safe
  MENU LABEL Unseenet - safe graphics (if the screen stays black)
  LINUX /boot/vmlinuz-lts
  INITRD /boot/initramfs-lts
  APPEND @CMDLINE@ nomodeset

LABEL text
  MENU LABEL Unseenet - text only (the terminal client and the node)
  LINUX /boot/vmlinuz-lts
  INITRD /boot/initramfs-lts
  APPEND @CMDLINE@ unseenet.text

LABEL selftest
  MENU LABEL Self-test (prints to the serial port, then shuts down)
  LINUX /boot/vmlinuz-lts
  INITRD /boot/initramfs-lts
  APPEND @CMDLINE@ console=tty1 console=ttyS0,115200 unseenet.selftest
